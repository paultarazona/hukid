# Dependencias del perfil local en Linux. No usar directamente: scripts/local-env.mjs y
# scripts/local-vault.mjs aportan puertos y secretos. Todo se publica sólo en loopback.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: hukid_local_admin
      POSTGRES_PASSWORD: ${HUKID_LOCAL_PG_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --encoding=UTF8 --locale=C
    command: postgres -c log_statement=none
    ports: ['127.0.0.1:${HUKID_PG_PORT:-54329}:5432']
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      # Por TCP: el servidor temporal de inicialización sólo escucha en el socket Unix.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, hukid_local_admin]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --hostname-strict=false
    environment:
      KC_DB: dev-file
      KC_DB_URL: jdbc:h2:file:/opt/keycloak/data/h2/keycloak;NON_KEYWORDS=VALUE
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${HUKID_LOCAL_KC_PASSWORD:-}
    ports: ['127.0.0.1:${HUKID_KC_PORT:-8081}:8080']
    volumes: [keycloak-data:/opt/keycloak/data]

  vault:
    image: hashicorp/vault:1.18.0
    command: server
    environment:
      # mlock desactivado, igual que en el perfil nativo; por eso no se pide IPC_LOCK.
      SKIP_SETCAP: 'true'
      VAULT_LOCAL_CONFIG: >-
        {"storage":{"file":{"path":"/vault/file"}},
        "listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},
        "api_addr":"http://127.0.0.1:${HUKID_VAULT_PORT:-18200}","disable_mlock":true,"ui":false}
    ports: ['127.0.0.1:${HUKID_VAULT_PORT:-18200}:8200']
    volumes: [vault-data:/vault/file]

volumes:
  postgres-data:
  keycloak-data:
  vault-data:
